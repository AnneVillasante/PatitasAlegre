spring.application.name=registro

# Conexion con MySQL usando el usuario del servicio (database/DB_users.sql)
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/clinica_auth?useSSL=false&serverTimezone=America/Lima&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:svc_auth}
spring.datasource.password=${DB_PASSWORD:Auth2026!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA: conservar las tablas existentes
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Puerto del backend Java
server.port=8080
