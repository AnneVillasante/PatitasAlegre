
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare | Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="encabezado">
        <h2>🐾 VetCare</h2>
        <p>Registro de propietarios</p>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h3>Crear cuenta</h3>
            <p>Registra tus datos para gestionar tus mascotas.</p>

            <form id="formRegistro">
                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre completo
                    </label>
                    <input type="text" id="nombre"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="documento" class="form-label">
                        DNI
                    </label>
                    <input type="text" id="documento"
                           class="form-control" maxlength="8"
                           pattern="[0-9]{8}"
                           title="Ingresa los 8 dígitos del DNI"
                           required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>
                    <input type="email" id="correo"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">
                        Teléfono
                    </label>
                    <input type="tel" id="telefono"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="direccion" class="form-label">
                        Dirección
                    </label>
                    <input type="text" id="direccion"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="clave" class="form-label">
                        Contraseña
                    </label>
                    <input type="password" id="clave"
                           class="form-control" minlength="8"
                           required>
                </div>

                <button type="submit" class="btn btn-vetcare w-100">
                    Registrarme
                </button>

                <div id="mensaje" class="mt-3"
                     role="status" aria-live="polite"></div>
            </form>

            <p class="registro">
                ¿Ya tienes cuenta?
                <a href="index.html">Inicia sesión</a>
            </p>
        </section>
    </main>

    <footer>
        <p>VetCare © 2026 · Cuidado y bienestar animal</p>
    </footer>

    <script>
        document.getElementById("formRegistro")
            .addEventListener("submit", async function(event) {
                event.preventDefault();

                const nombre = document.getElementById("nombre").value.trim();
                const correo = document.getElementById("correo").value.trim();
                const clave = document.getElementById("clave").value;
                const mensajeEl = document.getElementById("mensaje");
                const submitBtn = this.querySelector('button[type="submit"]');

                mensajeEl.className = "mt-3 alert alert-info";
                mensajeEl.textContent = "Conectando con el microservicio de registro...";
                submitBtn.disabled = true;

                try {
                    const respuesta = await fetch("http://127.0.0.1:8080/api/registro", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json",
                            "Accept": "application/json"
                        },
                        body: JSON.stringify({
                            username: nombre,
                            email: correo,
                            password: clave
                        })
                    });

                    let datos = {};
                    try {
                        datos = await respuesta.json();
                    } catch (e) {
                        datos = { mensaje: "Respuesta no válida del servidor." };
                    }

                    if (respuesta.ok && datos.ok) {
                        mensajeEl.className = "mt-3 alert alert-success";
                        mensajeEl.textContent = "¡Registro exitoso! Redirigiendo al inicio de sesión...";
                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 1500);
                    } else {
                        mensajeEl.className = "mt-3 alert alert-danger";
                        mensajeEl.textContent = datos.mensaje || `Error (${respuesta.status}) al registrar.`;
                    }
                } catch (error) {
                    mensajeEl.className = "mt-3 alert alert-danger";
                    mensajeEl.textContent = "No se pudo conectar con el microservicio en el puerto 8080 (Spring Boot).";
                } finally {
                    submitBtn.disabled = false;
                }
            });
    </script>

</body>
</html>
