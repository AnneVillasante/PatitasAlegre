<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare | Tienda de accesorios</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        header {
            background: #246b63;
            color: white;
            padding: 20px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        header h1 {
            margin: 0;
        }

        header button {
            background: white;
            color: #246b63;
            font-weight: bold;
        }

        main {
            max-width: 1200px;
            margin: 25px auto;
            padding: 0 20px;
        }

        .principal {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 25px;
            align-items: start;
        }

        .panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 2px 8px #0000000d;
        }

        .filtros {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 15px 0 20px;
        }

        button,
        select {
            border: 0;
            border-radius: 7px;
            padding: 10px 13px;
            cursor: pointer;
            font-size: 14px;
        }

        button {
            background: #246b63;
            color: white;
        }

        button:hover {
            opacity: 0.88;
        }

        .filtros button {
            background: #e5eeec;
            color: #246b63;
        }

        .filtros button.activo {
            background: #246b63;
            color: white;
        }

        .catalogo {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 15px;
        }

        .producto {
            border: 1px solid #e0e5e3;
            border-radius: 10px;
            padding: 16px;
        }

        .producto h3 {
            margin: 10px 0;
        }

        .producto p {
            margin: 7px 0;
            color: #5b6663;
        }

        .precio {
            font-size: 21px;
            font-weight: bold;
            color: #246b63 !important;
        }

        .stock {
            font-size: 13px;
        }

        .producto button {
            width: 100%;
            margin-top: 10px;
        }

        .carrito-item {
            border-bottom: 1px solid #e5e5e5;
            padding: 12px 0;
        }

        .carrito-item p {
            margin: 7px 0;
        }

        .cantidad {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 8px;
        }

        .cantidad button {
            padding: 6px 11px;
        }

        .eliminar {
            background: #b83c3c;
        }

        .total {
            font-size: 22px;
            font-weight: bold;
            margin-top: 20px;
        }

        .vaciar {
            background: #697572;
        }

        .mensaje {
            margin-top: 12px;
            font-size: 14px;
        }

        .vacio {
            color: #66716e;
            padding: 15px 0;
        }

        @media (max-width: 800px) {
            .principal {
                grid-template-columns: 1fr;
            }

            .catalogo {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }
        }

        @media (max-width: 480px) {
            .catalogo {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>🐾 VetCare</h1>
            <p>Todo para consentir a tu mascota</p>
        </div>

        <button onclick="irAlCarrito()">
            🛒 Carrito (<span id="contador">0</span>)
        </button>
    </header>

    <main>
        <div class="principal">

            <section class="panel">
                <h2>Accesorios para tu mascota</h2>
                <p>Explora nuestros productos y elige tus favoritos.</p>

                <label for="busqueda">Buscar producto:</label>
                <input id="busqueda" type="search" placeholder="Ej. pelota, collar..."
                    style="padding:10px;width:100%;margin-top:8px;border:1px solid #ccc;border-radius:7px">

                <h3>Categorías</h3>
                <div id="filtros" class="filtros">
                    <button class="activo" data-categoria="Todas">Todas</button>
                </div>

                <div id="catalogo" class="catalogo">
                    <p class="vacio">Cargando productos...</p>
                </div>
            </section>

            <aside class="panel" id="carrito">
                <h2>🛒 Mi carrito</h2>
                <div id="listaCarrito">
                    <p class="vacio">Tu carrito está vacío.</p>
                </div>

                <p class="total">
                    Total: S/ <span id="total">0.00</span>
                </p>

                <button class="vaciar" onclick="vaciarCarrito()">
                    Vaciar carrito
                </button>

                <button onclick="comprar()">
                    Continuar compra
                </button>

                <p id="mensaje" class="mensaje"></p>
            </aside>

        </div>
    </main>

    <script>
        const API = "http://localhost:3000/api/productos";

        let productos = [];
        let carrito = [];
        let categoriaActual = "Todas";

        async function iniciarTienda() {
            try {
                const [respuestaProductos, respuestaCategorias] =
                    await Promise.all([
                        fetch(API),
                        fetch(API + "/categorias")
                    ]);

                if (!respuestaProductos.ok || !respuestaCategorias.ok) {
                    throw new Error("Error al consultar la API");
                }

                productos = await respuestaProductos.json();
                const categorias = await respuestaCategorias.json();

                mostrarCategorias(categorias);
                mostrarProductos();
            } catch (error) {
                document.getElementById("catalogo").textContent =
                    "No se pudo conectar. Comprueba que Node.js esté ejecutándose.";
            }
        }

        function mostrarCategorias(categorias) {
            const filtros = document.getElementById("filtros");
            filtros.innerHTML = "";

            const nombres = ["Todas", ...categorias.map(c => c.nombre)];

            nombres.forEach(nombre => {
                const boton = document.createElement("button");
                boton.textContent = nombre;
                boton.dataset.categoria = nombre;

                if (nombre === categoriaActual) {
                    boton.classList.add("activo");
                }

                boton.addEventListener("click", () => {
                    categoriaActual = nombre;

                    document.querySelectorAll("#filtros button")
                        .forEach(b => b.classList.remove("activo"));

                    boton.classList.add("activo");
                    mostrarProductos();
                });

                filtros.appendChild(boton);
            });
        }

        function mostrarProductos() {
            const catalogo = document.getElementById("catalogo");
            const busqueda = document.getElementById("busqueda")
                .value.trim().toLowerCase();

            catalogo.innerHTML = "";

            const filtrados = productos.filter(p => {
                const coincideCategoria =
                    categoriaActual === "Todas" ||
                    p.categoria === categoriaActual;

                const coincideBusqueda =
                    p.nombre.toLowerCase().includes(busqueda) ||
                    (p.descripcion || "").toLowerCase().includes(busqueda);

                return p.estado === "ACTIVO" &&
                    Number(p.stock) > 0 &&
                    coincideCategoria &&
                    coincideBusqueda;
            });

            if (filtrados.length === 0) {
                catalogo.innerHTML =
                    '<p class="vacio">No hay productos para mostrar en esta categoría.</p>';
                return;
            }

            filtrados.forEach(p => {
                const tarjeta = document.createElement("article");
                tarjeta.className = "producto";

                const nombre = document.createElement("h3");
                nombre.textContent = p.nombre;

                const categoria = document.createElement("p");
                categoria.textContent = p.categoria || "Sin categoría";

                const descripcion = document.createElement("p");
                descripcion.textContent = p.descripcion || "Accesorio para mascotas";

                const precio = document.createElement("p");
                precio.className = "precio";
                precio.textContent = "S/ " + Number(p.precio).toFixed(2);

                const stock = document.createElement("p");
                stock.className = "stock";
                stock.textContent = "Disponibles: " + p.stock;

                const boton = document.createElement("button");
                boton.textContent = "Agregar al carrito";
                boton.addEventListener("click", () => agregar(p.idProducto));

                tarjeta.append(nombre, categoria, descripcion, precio, stock, boton);
                catalogo.appendChild(tarjeta);
            });
        }

        function agregar(id) {
            const producto = productos.find(p => p.idProducto === id);
            if (!producto) return;

            const item = carrito.find(p => p.idProducto === id);

            if (item) {
                if (item.cantidad >= Number(producto.stock)) {
                    alert("No hay suficiente stock.");
                    return;
                }
                item.cantidad++;
            } else {
                carrito.push({ ...producto, cantidad: 1 });
            }

            document.getElementById("mensaje").textContent = "";
            mostrarCarrito();
        }

        function cambiarCantidad(id, cambio) {
            const item = carrito.find(p => p.idProducto === id);
            const producto = productos.find(p => p.idProducto === id);

            if (!item || !producto) return;

            const nuevaCantidad = item.cantidad + cambio;

            if (nuevaCantidad > Number(producto.stock)) {
                alert("No hay suficiente stock.");
                return;
            }

            if (nuevaCantidad <= 0) {
                carrito = carrito.filter(p => p.idProducto !== id);
            } else {
                item.cantidad = nuevaCantidad;
            }

            mostrarCarrito();
        }

        function mostrarCarrito() {
            const lista = document.getElementById("listaCarrito");
            lista.innerHTML = "";

            let total = 0;
            let unidades = 0;

            if (carrito.length === 0) {
                lista.innerHTML = '<p class="vacio">Tu carrito está vacío.</p>';
            }

            carrito.forEach(item => {
                const subtotal = Number(item.precio) * item.cantidad;
                total += subtotal;
                unidades += item.cantidad;

                const div = document.createElement("div");
                div.className = "carrito-item";

                const nombre = document.createElement("strong");
                nombre.textContent = item.nombre;

                const detalle = document.createElement("p");
                detalle.textContent =
                    `S/ ${Number(item.precio).toFixed(2)} por unidad`;

                const subtotalTexto = document.createElement("p");
                subtotalTexto.textContent = "Subtotal: S/ " + subtotal.toFixed(2);

                const controles = document.createElement("div");
                controles.className = "cantidad";

                const menos = document.createElement("button");
                menos.textContent = "−";
                menos.onclick = () => cambiarCantidad(item.idProducto, -1);

                const cantidad = document.createElement("span");
                cantidad.textContent = item.cantidad;

                const mas = document.createElement("button");
                mas.textContent = "+";
                mas.onclick = () => cambiarCantidad(item.idProducto, 1);

                const eliminar = document.createElement("button");
                eliminar.textContent = "Eliminar";
                eliminar.className = "eliminar";
                eliminar.onclick = () => {
                    carrito = carrito.filter(p => p.idProducto !== item.idProducto);
                    mostrarCarrito();
                };

                controles.append(menos, cantidad, mas);
                div.append(nombre, detalle, subtotalTexto, controles, eliminar);
                lista.appendChild(div);
            });

            document.getElementById("total").textContent = total.toFixed(2);
            document.getElementById("contador").textContent = unidades;
        }

        function vaciarCarrito() {
            carrito = [];
            mostrarCarrito();
            document.getElementById("mensaje").textContent = "";
        }

        function irAlCarrito() {
            document.getElementById("carrito").scrollIntoView({
                behavior: "smooth"
            });
        }

        function comprar() {
            const mensaje = document.getElementById("mensaje");

            if (carrito.length === 0) {
                mensaje.textContent = "Primero agrega productos al carrito.";
                return;
            }

            mensaje.textContent =
                "Carrito listo. En el siguiente paso conectaremos la compra con el backend.";
        }

        document.getElementById("busqueda")
            .addEventListener("input", mostrarProductos);

        iniciarTienda();
    </script>

</body>

</html>
