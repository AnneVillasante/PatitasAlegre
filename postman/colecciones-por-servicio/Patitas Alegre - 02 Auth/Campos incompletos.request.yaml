$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@clinica.com"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Rechazo 400 por campos faltantes', function () {
          pm.expect(pm.response.code).to.eql(400);
      });
order: 5000
