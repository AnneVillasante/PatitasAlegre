$kind: http-request
url: "{{baseUrl}}/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@clinica.com",
      "password": "admin123",
      "rol": "CLIENTE"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Rechazo 403 por rol discrepante', function () {
          pm.expect(pm.response.code).to.eql(403);
          var data = pm.response.json();
          pm.expect(data.ok).to.be.false;
      });
order: 4000
