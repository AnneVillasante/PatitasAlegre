$kind: http-request
url: "{{baseUrl}}/api/salud"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Servicio conectado a MySQL', function () {
          pm.expect(pm.response.code).to.eql(200);
          var data = pm.response.json();
          pm.expect(data.estado).to.eql('conectado');
      });
order: 1000
