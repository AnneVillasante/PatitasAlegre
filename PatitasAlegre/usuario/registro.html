
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare | Registro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

    <header class="encabezado">
        <h2>🐾 VetCare</h2>
        <p>Registro de propietarios</p>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h3>Crear cuenta</h3>
            <p>Registra tus datos para gestionar tus mascotas.</p>

            <form id="formRegistro">
                <div class="mb-3">
                    <label for="nombre" class="form-label">
                        Nombre completo
                    </label>
                    <input type="text" id="nombre"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="documento" class="form-label">
                        DNI
                    </label>
                    <input type="text" id="documento"
                           class="form-control" maxlength="8"
                           pattern="[0-9]{8}"
                           title="Ingresa los 8 dígitos del DNI"
                           required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label">
                        Correo electrónico
                    </label>
                    <input type="email" id="correo"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="telefono" class="form-label">
                        Teléfono
                    </label>
                    <input type="tel" id="telefono"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="direccion" class="form-label">
                        Dirección
                    </label>
                    <input type="text" id="direccion"
                           class="form-control" required>
                </div>

                <div class="mb-3">
                    <label for="clave" class="form-label">
                        Contraseña
                    </label>
                    <input type="password" id="clave"
                           class="form-control" minlength="8"
                           required>
                </div>

                <button type="submit" class="btn btn-vetcare w-100">
                    Registrarme
                </button>

                <div id="mensaje" class="mt-3"
                     role="status" aria-live="polite"></div>
            </form>

            <p class="registro">
                ¿Ya tienes cuenta?
                <a href="index.html">Inicia sesión</a>
            </p>
        </section>
    </main>

    <footer>
        <p>VetCare © 2026 · Cuidado y bienestar animal</p>
    </footer>

    <script>
        document.getElementById("formRegistro")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("mensaje").textContent =
                    "Formulario validado visualmente. El registro real " +
                    "se habilitará al conectar el backend.";
            });
    </script>

</body>
</html>
