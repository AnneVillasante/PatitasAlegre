
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare | Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
    <header class="encabezado">
        <h2>🐾 VetCare</h2>
        <p>Sistema de gestión veterinaria</p>
    </header>

    <main class="contenedor">
        <section class="tarjeta">
            <h3>Bienvenido</h3>
            <p>Ingresa a tu cuenta para gestionar tus mascotas.</p>

            <form>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" id="correo" class="form-control"
                           placeholder="correo@ejemplo.com" required>
                </div>

                <div class="mb-3">
                    <label for="clave" class="form-label">Contraseña</label>
                    <input type="password" id="clave" class="form-control"
                           placeholder="Ingresa tu contraseña" required>
                </div>

                <button type="submit" class="btn btn-vetcare w-100">
                    Iniciar sesión
                </button>
            </form>

            <p class="registro">
                ¿No tienes cuenta?
                <a href="registro.html">Regístrate aquí</a>
            </p>
        </section>
    </main>

    <footer>
        <p>VetCare © 2026 · Cuidado y bienestar animal</p>
    </footer>
</body>
</html>
