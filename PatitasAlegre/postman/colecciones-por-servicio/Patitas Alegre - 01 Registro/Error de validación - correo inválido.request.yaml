$kind: http-request
url: "{{baseUrl}}/api/registro"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "usuario_invalido",
      "email": "correo-sin-formato",
      "password": "Password2026!"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Respuesta 400 por validación', function () {
          pm.expect(pm.response.code).to.eql(400);
      });
order: 3000
