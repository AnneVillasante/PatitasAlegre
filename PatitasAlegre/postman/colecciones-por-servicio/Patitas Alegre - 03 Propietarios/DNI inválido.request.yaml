url: "{{baseUrl}}/propietarios/registrar"
method: POST
headers:
  Content-Type: text/xml
body:
  type: text
  content: <registrarPropietarioRequest><dni>123</dni><nombres>Inválido</nombres><apellidos>Prueba</apellidos></registrarPropietarioRequest>
scripts:
