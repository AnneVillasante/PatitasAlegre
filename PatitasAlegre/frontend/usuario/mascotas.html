
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VetCare | Mis mascotas</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

<header class="encabezado">
    <h2>🐾 VetCare</h2>
    <p>Gestión de mascotas</p>
</header>

<main class="container py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h3>Mis mascotas</h3>
            <p class="text-secondary mb-0">
                Registra a tus compañeros y consulta sus datos.
            </p>
        </div>
        <a href="dashboard.html" class="btn btn-outline-secondary">
            Volver
        </a>
    </div>

    <section class="card mb-4">
        <div class="card-body">
            <h5 class="mb-3">Registrar mascota</h5>

            <form id="formMascota">
                <div class="row g-3">

                    <div class="col-md-6">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" id="nombre" class="form-control"
                               required>
                    </div>

                    <div class="col-md-6">
                        <label for="especie" class="form-label">Especie</label>
                        <select id="especie" class="form-select" required>
                            <option value="">Seleccionar</option>
                            <option value="Perro">Perro</option>
                            <option value="Gato">Gato</option>
                            <option value="Ave">Ave</option>
                            <option value="Otro">Otro</option>
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="raza" class="form-label">Raza</label>
                        <input type="text" id="raza" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="edad" class="form-label">Edad (años)</label>
                        <input type="number" id="edad" class="form-control"
                               min="0" max="100" step="0.1" required>
                    </div>

                    <div class="col-md-6">
                        <label for="peso" class="form-label">Peso (kg)</label>
                        <input type="number" id="peso" class="form-control"
                               min="0.01" max="1000" step="0.01" required>
                    </div>

                    <div class="col-md-6">
                        <label for="color" class="form-label">Color</label>
                        <input type="text" id="color" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="chip" class="form-label">
                            Número de chip (opcional)
                        </label>
                        <input type="text" id="chip" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="alergias" class="form-label">
                            Alergias conocidas
                        </label>
                        <input type="text" id="alergias" class="form-control"
                               placeholder="Ninguna conocida, si corresponde">
                    </div>

                    <div class="col-12">
                        <button type="submit" class="btn btn-vetcare">
                            Registrar mascota
                        </button>
                    </div>

                </div>
            </form>

            <div id="mensaje" class="mt-3" role="status"
                 aria-live="polite"></div>
        </div>
    </section>

    <section class="card">
        <div class="card-body">
            <h5 class="mb-3">Mascotas registradas en esta sesión</h5>

            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Especie</th>
                            <th>Raza</th>
                            <th>Edad</th>
                            <th>Peso</th>
                        </tr>
                    </thead>
                    <tbody id="tablaMascotas">
                        <tr>
                            <td colspan="5" class="text-center text-secondary">
                                Todavía no hay mascotas registradas.
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>

</main>

<footer>
    <p>VetCare © 2026 · Cuidado y bienestar animal</p>
</footer>

<script>
    const formulario = document.getElementById("formMascota");
    const tabla = document.getElementById("tablaMascotas");
    const mensaje = document.getElementById("mensaje");

    formulario.addEventListener("submit", function(event) {
        event.preventDefault();

        const mascota = {
            nombre: document.getElementById("nombre").value.trim(),
            especie: document.getElementById("especie").value,
            raza: document.getElementById("raza").value.trim(),
            edad: document.getElementById("edad").value,
            peso: document.getElementById("peso").value
        };

        if (!mascota.nombre || !mascota.especie) {
            mensaje.textContent = "Completa los campos obligatorios.";
            return;
        }

        const fila = document.createElement("tr");

        Object.values(mascota).forEach(function(valor) {
            const celda = document.createElement("td");
            celda.textContent = valor || "No especificada";
            fila.appendChild(celda);
        });

        if (tabla.querySelector("td[colspan]")) {
            tabla.innerHTML = "";
        }

        tabla.appendChild(fila);
        formulario.reset();

        mensaje.textContent =
            "Mascota añadida a la tabla temporal. Aún no se ha guardado en una base de datos.";
    });
</script>

</body>
</html>
